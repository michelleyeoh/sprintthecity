name: Development Check

on:
  pull_request:
    branches:
      - "*"

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    environment:
      name: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "mongodb://localhost:27017/dummy"
        run: npx prisma generate

      - name: Build Next.js app
        env:
          DATABASE_URL: "mongodb://localhost:27017/dummy"
        run: npm run build

      - name: Success
        run: echo "🚧 Development Check Successful 🚧 "
